<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Editar Equipo - Inventario Clínico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center mb-4">Editar Equipo</h2>
    <form method="post" class="mx-auto" style="max-width: 500px;">
        <div class="mb-3">
            <input type="text" name="nombre" class="form-control" placeholder="Nombre" value="{{ equipo[1] }}" required />
        </div>
        <div class="mb-3">
            <input type="text" name="marca" class="form-control" placeholder="Marca" value="{{ equipo[2] }}" />
        </div>
        <div class="mb-3">
            <input type="text" name="modelo" class="form-control" placeholder="Modelo" value="{{ equipo[3] }}" />
        </div>
        <div class="mb-3">
            <input type="text" name="estado" class="form-control" placeholder="Estado" value="{{ equipo[4] }}" />
        </div>
        <div class="mb-3">
            <input type="date" name="fecha_compra" class="form-control" placeholder="Fecha de compra" value="{{ equipo[5] }}" />
        </div>
        <div class="mb-3">
            <input type="date" name="fecha_mantenimiento" class="form-control" placeholder="Fecha de mantenimiento" value="{{ equipo[6] }}" />
        </div>
        <div class="mb-3">
            <input type="text" name="ubicacion" class="form-control" placeholder="Ubicación" value="{{ equipo[7] }}" />
        </div>
        <div class="mb-3">
            <input type="number" name="cantidad" class="form-control" placeholder="Cantidad" min="1" value="{{ equipo[8] }}" required />
        </div>
        <!-- Campo precio actualizado -->
        <div class="mb-3">
            <input type="number" step="0.01" name="precio" class="form-control" placeholder="Precio Unitario (S/.)" min="0" value="{{ equipo[9] }}" required />
        </div>
        <div class="mb-3">
            <input type="text" name="foto" class="form-control" placeholder="URL de la foto (opcional)" value="{{ equipo[10] }}" />
        </div>
        <div class="mb-3">
            <textarea name="observaciones" class="form-control" placeholder="Observaciones">{{ equipo[11] }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Guardar Cambios</button>
    </form>
    <div class="text-center mt-3">
        <a href="/index">Volver al Inventario</a>
    </div>
</div>
</body>
</html>
