<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Ventas - Inventario Clínico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-center text-success">Registrar Venta 🛒</h2>
    <form action="/ventas" method="post" class="row g-3 mt-3">
        <div class="col-md-6">
            <label class="form-label">Nombre del Cliente</label>
            <input type="text" name="cliente" class="form-control" placeholder="Nombre del cliente" required />
        </div>
        <div class="col-md-6">
            <label class="form-label">Selecciona un equipo</label>
            <select name="equipo_id" class="form-control" required>
                {% for e in equipos %}
                <option value="{{ e[0] }}">{{ e[1] }} - Stock: {{ e[8] }} - Precio: {{ e[9] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Cantidad a vender</label>
            <input type="number" name="cantidad" class="form-control" min="1" required />
        </div>
        <div class="col-12 d-grid mt-3">
            <button class="btn btn-warning">Realizar Venta ✅</button>
        </div>
    </form>
    <a href="/index" class="btn btn-secondary mt-4">Volver al Inventario</a>
</div>
</body>
</html>
