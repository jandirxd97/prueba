<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Agregar Equipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2>Agregar Equipo Médico</h2>
    <form method="POST" action="/agregar_equipo">
        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control" required />
        </div>
        <div class="mb-3">
            <label>Marca</label>
            <input type="text" name="marca" class="form-control" />
        </div>
        <div class="mb-3">
            <label>Modelo</label>
            <input type="text" name="modelo" class="form-control" />
        </div>
        <div class="mb-3">
            <label>Estado</label>
            <input type="text" name="estado" class="form-control" />
        </div>
        <div class="mb-3">
            <label>Fecha Compra</label>
            <input type="date" name="fecha_compra" class="form-control" />
        </div>
        <div class="mb-3">
            <label>Fecha Mantenimiento</label>
            <input type="date" name="fecha_mantenimiento" class="form-control" />
        </div>
        <div class="mb-3">
            <label>Ubicación</label>
            <input type="text" name="ubicacion" class="form-control" />
        </div>
        <div class="mb-3">
            <label>Cantidad</label>
            <input type="number" name="cantidad" class="form-control" required />
        </div>
        <div class="mb-3">
            <label>Precio Unitario</label>
            <input type="number" step="0.01" name="precio" class="form-control" required />
        </div>
        <div class="mb-3">
            <label>Foto (URL)</label>
            <input type="text" name="foto" class="form-control" />
        </div>
        <div class="mb-3">
            <label>Observaciones</label>
            <textarea name="observaciones" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Agregar</button>
        <a href="/index" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
