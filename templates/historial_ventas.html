<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Historial de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-center text-primary">Historial de Ventas</h2>
    <table class="table table-bordered table-striped bg-white">
        <thead>
            <tr>
                <th>ID Venta</th>
                <th>Cliente</th>
                <th>Equipo</th>
                <th>Cantidad</th>
                <th>Precio Unitario (S/.)</th>
                <th>Fecha</th>
                <th>Subtotal (S/.)</th>
            </tr>
        </thead>
        <tbody>
            {% for v in ventas %}
            <tr>
                <td>{{ v[0] }}</td>
                <td>{{ v[1] }}</td>
                <td>{{ v[4] }}</td>
                <td>{{ v[2] }}</td>
                <td>{{ '%.2f'|format(v[5] | float) }}</td>
                <td>{{ v[3] }}</td>
                <td>{{ '%.2f'|format((v[2] * v[5]) | float) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <div class="text-center mt-3">
        <a href="/index" class="btn btn-secondary">Volver al Inventario</a>
    </div>
</div>
</body>
</html>
