<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Boleta Electrónica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .boleta {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            background: #fff;
        }
        .titulo {
            text-align: center;
            margin-bottom: 20px;
        }
        .total {
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body class="bg-light">
<div class="boleta">
    <h2 class="titulo">K& Health Import Eirl</h2>
    <p><strong>Venta ID:</strong> {{ venta[0] }}</p>
    <p><strong>Cliente:</strong> {{ venta[1] }}</p>
    <p><strong>Producto:</strong> {{ venta[4] }}</p>
    <p><strong>Cantidad:</strong> {{ venta[2] }}</p>
    <p><strong>Fecha:</strong> {{ venta[3] }}</p>
    <p><strong>Precio Unitario:</strong> S/. {{ '%.2f'|format(venta[5] | float) }}</p>
    <p class="total">Total: S/. {{ '%.2f'|format(total | float) }}</p>
</div>
</body>
</html>
